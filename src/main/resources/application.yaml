spring:
  application:
    name: workmate

management:
  endpoints:
    web:
      exposure:
        # 只支持 "*" 或 "*后缀" 两种通配；仅 health/info 等基础端点，直接全放开。
        include: "*"

# AgentScope：仅使用官方 starter 的自动配置能力
agentscope:
  # 关闭官方默认 ReActAgent，agent 统一由 workmate.agents 声明
  agent:
    enabled: false
  model:
    provider: openai
  openai:
    # CPA(CLIProxyAPI) 反代 WorkBuddy 真实模型；key 经环境变量 OPENAI_API_KEY 注入（勿硬编码提交）
    api-key: ${OPENAI_API_KEY:}
    model-name: ${OPENAI_MODEL:hy3}
    base-url: ${OPENAI_BASE_URL:http://127.0.0.1:8317/v1}
    stream: true
  agui:
    path-prefix: /agui
    # 必须是 workmate.agents 中的某个 key
    default-agent-id: default
    enable-reasoning: true
    emit-token-usage: true

# 业务侧 agent 目录：key 即 agent id，同时是 AG-UI 路由段
workmate:
  agents:
    # 通用助手：非只读工具走 AG-UI HITL 审批；开启技能自管理 + 策展（经验可沉淀为技能）
    default:
      name: Workmate
      description: 通用助手，非只读操作会请求你的审批
      sys-prompt: You are Workmate, a helpful general assistant.
      workspace: .agentscope/workspace/default
      permission-mode: default
      enable-skill-manage-tool: true
      enable-skill-curator: true
      # MCP「连接器」：声明式接入外部 MCP server（官方 ToolsConfig.mcpServers，per-agent 独立）。
      # 取消注释并按需填写即生效；连接器以 MCP 标准协议接入任意外部服务（数据库/API/文件/云服务）。
      # 三种 transport（三选一）：
      #   stdio          —— command + args（本地子进程，如 npx some-mcp-server）
      #   sse            —— url（远程，需 headers 带 token）
      #   streamableHttp —— url（远程）
      # tools-config:
      #   mcp-servers:
      #     filesystem:                 # stdio 示例：本地文件 MCP
      #       transport: stdio
      #       command: npx
      #       args: ["-y", "@modelcontextprotocol/server-filesystem", "."]
      #     remote-api:                 # streamableHttp 示例：远程服务
      #       transport: streamableHttp
      #       url: http://127.0.0.1:9000/mcp
      #       headers:
      #         authorization: "Bearer ${MCP_TOKEN:}"
    # 编码 agent：工作区内自动放行编辑，允许进入计划模式
    coder:
      name: Coder
      description: 编码助手，工作区内的编辑自动放行
      sys-prompt: You are a senior software engineer. Prefer minimal, verifiable changes.
      workspace: .agentscope/workspace/coder
      permission-mode: accept-edits
      enable-plan-mode: true
      max-iters: 30
    # 只读分析 agent：不发起任何写操作
    explorer:
      name: Explorer
      description: 只读分析，不执行任何写操作
      sys-prompt: You are a read-only analyst. Never modify files or run mutating commands.
      workspace: .agentscope/workspace/explorer
      permission-mode: explore
      max-iters: 15
