spring:
  application:
    name: workmate

management:
  endpoints:
    web:
      exposure:
        # 暴露 agentscope-admin 提供的管控端点（agents/permissions/usage/tools/models/...）
        include: "health,info,agentscope-*"

# AgentScope：仅使用官方 starter 的自动配置能力
agentscope:
  # 关闭官方默认 ReActAgent，agent 统一由 workmate.agents 声明
  agent:
    enabled: false
  model:
    provider: openai
  openai:
    api-key: ${OPENAI_API_KEY:}
    model-name: ${OPENAI_MODEL:gpt-4.1-mini}
    base-url: ${OPENAI_BASE_URL:}
    stream: true
  agui:
    path-prefix: /agui
    # 必须是 workmate.agents 中的某个 key
    default-agent-id: default
    enable-reasoning: true
    emit-token-usage: true
  admin:
    # 官方管控面（actuator 端点 + 审计 + 用量），默认关闭需显式开启
    enabled: true

# 业务侧 agent 目录：key 即 agent id，同时是 AG-UI 路由段
workmate:
  agents:
    # 通用助手：非只读工具走 AG-UI HITL 审批
    default:
      name: Workmate
      sys-prompt: You are Workmate, a helpful general assistant.
      workspace: .agentscope/workspace/default
      permission-mode: default
    # 编码 agent：工作区内自动放行编辑，允许进入计划模式
    coder:
      name: Coder
      sys-prompt: You are a senior software engineer. Prefer minimal, verifiable changes.
      workspace: .agentscope/workspace/coder
      permission-mode: accept-edits
      enable-plan-mode: true
      max-iters: 30
    # 只读分析 agent：不发起任何写操作
    explorer:
      name: Explorer
      sys-prompt: You are a read-only analyst. Never modify files or run mutating commands.
      workspace: .agentscope/workspace/explorer
      permission-mode: explore
      max-iters: 15
