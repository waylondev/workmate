spring:
  application:
    name: workmate

# AgentScope：仅使用官方 starter 的自动配置能力
agentscope:
  # 关闭官方默认 ReActAgent，改由 HarnessAgent 作为唯一 agent
  agent:
    enabled: false
  model:
    provider: openai
  openai:
    api-key: ${OPENAI_API_KEY:}
    model-name: ${OPENAI_MODEL:gpt-4.1-mini}
    base-url: ${OPENAI_BASE_URL:}
    stream: true
  agui:
    path-prefix: /agui
    default-agent-id: default
    enable-reasoning: true
    emit-token-usage: true

# 业务侧 harness agent 定义（未列出的能力沿用 HarnessAgent 官方默认值）
workmate:
  agent:
    name: Workmate
    sys-prompt: You are Workmate, a helpful assistant.
    workspace: .agentscope/workspace
    # default：非只读工具走 AG-UI HITL 审批；bypass：全部放行
    permission-mode: default
    max-iters: 10
    max-context-tokens: 8000
    enable-plan-mode: false
    enable-tracing-log: true
